[ui.xhealth.command.helper]
en = "Arguments support shell-style quotes and escapes. Use an explicit shell, such as sh -c, to expand environment variables. The example requires sh and wget in the App image."
zh-CN = "参数支持 shell 风格的引号和转义。需要展开环境变量时，请显式使用 sh -c 等 shell 命令。示例要求应用镜像包含 sh 和 wget。"
zh-TW = "參數支援 shell 形式的引號和跳脫字元。若需展開環境變數，請明確使用 sh -c 等 shell 指令。範例要求應用程式映像檔包含 sh 和 wget。"
ja = "引数にはシェル形式の引用符とエスケープを使えます。環境変数を展開するには、sh -c などでシェルを明示してください。この例では、アプリのイメージに sh と wget が必要です。"
pt-BR = "Os argumentos aceitam aspas e escapes no estilo do shell. Para expandir variáveis de ambiente, use um shell explicitamente, como sh -c. O exemplo requer sh e wget na imagem da aplicação."
es = "Los argumentos admiten comillas y caracteres de escape de shell. Para expandir variables de entorno, usa un shell explícito, como sh -c. El ejemplo requiere sh y wget en la imagen de la aplicación."
fr = "Les arguments acceptent les guillemets et les échappements de type shell. Pour développer les variables d’environnement, utiliser explicitement un shell, par exemple sh -c. Cet exemple nécessite sh et wget dans l’image de l’application."
de = "Argumente unterstützen Anführungszeichen und Escape-Sequenzen wie in einer Shell. Zum Auflösen von Umgebungsvariablen ausdrücklich eine Shell wie sh -c verwenden. Das Beispiel benötigt sh und wget im App-Image."

