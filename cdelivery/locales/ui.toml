[ui.xhealth.method.hurl_description]
en = "Upload a Hurl file; CDelivery runs its test cases on a schedule to judge the App's health. Reference the target URL as the <code>{{TARGET_URL}}</code> variable, substituted at run time."
zh-CN = "上传 Hurl 文件后，CDelivery 会定时执行其中的测试用例，根据结果判断应用健康状态。目标 URL 在文件中用 <code>{{TARGET_URL}}</code> 变量引用，执行时替换为实际值。"
zh-TW = "上傳 Hurl 檔案後，CDelivery 會定時執行其中的測試案例，依結果判斷應用程式的健康狀態。目標 URL 在檔案中以 <code>{{TARGET_URL}}</code> 變數引用，執行時會替換為實際值。"
ja = "Hurl ファイルをアップロードすると、CDelivery が定期的にテストを実行し、アプリの状態を判定します。テスト対象の URL は <code>{{TARGET_URL}}</code> で指定し、実行時に実際の値に置き換えます。"
pt-BR = "Envie um arquivo Hurl. O CDelivery executa os testes conforme o agendamento para verificar a saúde da aplicação. Use a variável <code>{{TARGET_URL}}</code> para a URL de destino; ela é substituída durante a execução."
es = "Sube un archivo Hurl para que CDelivery ejecute sus pruebas periódicamente y compruebe el estado de la aplicación. Usa la variable <code>{{TARGET_URL}}</code> para la URL de destino; se sustituye por su valor al ejecutar las pruebas."
fr = "Importer un fichier Hurl. CDelivery exécute régulièrement ses tests pour vérifier l’état de santé de l’application. Dans le fichier, utiliser <code>{{TARGET_URL}}</code> pour l’URL cible ; cette variable est remplacée à l’exécution."
de = "Eine Hurl-Datei hochladen. CDelivery führt die enthaltenen Tests regelmäßig aus, um den Zustand der App zu prüfen. Die Ziel-URL als Variable <code>{{TARGET_URL}}</code> angeben; sie wird bei der Ausführung ersetzt."

[ui.xhealth.method.custom.label]
en = "Custom Method"
zh-CN = "自定义方式"
zh-TW = "自訂方式"
ja = "カスタム"
pt-BR = "Método personalizado"
es = "Método personalizado"
fr = "Méthode personnalisée"
de = "Eigene Testmethode"

[ui.xhealth.method.custom_description]
en = "Run the test command on a schedule in a separate container using the App image. localhost refers to the check container itself. The target address and port are injected as <code>TARGET_HOST</code> and <code>TARGET_PORT</code>."
zh-CN = "使用应用镜像，在独立容器中定时执行测试命令。localhost 指向检查容器自身。测试目标的地址和端口通过环境变量 <code>TARGET_HOST</code> 和 <code>TARGET_PORT</code> 注入。"
zh-TW = "使用應用程式映像檔，在獨立容器中定時執行測試指令。localhost 指向檢查容器本身。測試目標的位址和連接埠會透過環境變數 <code>TARGET_HOST</code> 和 <code>TARGET_PORT</code> 傳入。"
ja = "アプリのイメージを使い、独立したコンテナでテストコマンドを定期実行します。localhost はテスト用コンテナ自身を指します。テスト対象のアドレスとポートは、環境変数 <code>TARGET_HOST</code> と <code>TARGET_PORT</code> に設定されます。"
pt-BR = "Execute o comando de teste conforme o agendamento, em um contêiner separado com a imagem da aplicação. localhost aponta para o próprio contêiner de teste. O endereço e a porta de destino são fornecidos nas variáveis <code>TARGET_HOST</code> e <code>TARGET_PORT</code>."
es = "Ejecuta periódicamente el comando de prueba en un contenedor independiente con la imagen de la aplicación. localhost apunta al propio contenedor de prueba. La dirección y el puerto de destino se proporcionan mediante <code>TARGET_HOST</code> y <code>TARGET_PORT</code>."
fr = "Exécuter régulièrement la commande de test dans un conteneur distinct utilisant l’image de l’application. localhost désigne le conteneur de test lui-même. L’adresse et le port cibles sont fournis par les variables <code>TARGET_HOST</code> et <code>TARGET_PORT</code>."
de = "Den Testbefehl regelmäßig in einem separaten Container mit dem App-Image ausführen. localhost verweist auf den Testcontainer selbst. Zieladresse und Port werden über <code>TARGET_HOST</code> und <code>TARGET_PORT</code> bereitgestellt."

[ui.xhealth.file.label]
