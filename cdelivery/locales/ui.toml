zh-CN = "每 5 分钟检查并逐个签发缺失证书，避免限流；每 8 小时检查续期，失败后续重试。"
zh-TW = "每 5 分鐘檢查並逐一簽發缺少的憑證，以避免觸及速率限制；每 8 小時檢查是否需要更新，失敗後會於後續週期重試。"
ja = "5分ごとに不足する証明書を確認し、レート制限を避けるため順番に発行します。更新の要否は8時間ごとに確認し、失敗した場合は次回以降に再試行します。"
pt-BR = "A cada 5 minutos, verifica os certificados ausentes e os emite um por vez para evitar limites de requisições. Verifica as renovações a cada 8 horas e tenta novamente nos próximos ciclos em caso de falha."
es = "Cada 5 minutos se comprueba qué certificados faltan y se emiten uno a uno para no superar los límites de solicitudes. Las renovaciones se comprueban cada 8 horas; si hay fallos, se reintenta en ciclos posteriores."
fr = "Toutes les 5 minutes, les certificats manquants sont identifiés puis émis un par un pour respecter les limites de requêtes. Les renouvellements sont vérifiés toutes les 8 heures. En cas d’échec, une nouvelle tentative est effectuée lors d’un cycle ultérieur."
de = "Alle 5 Minuten nach fehlenden Zertifikaten suchen und sie nacheinander ausstellen, um Anfragelimits einzuhalten. Alle 8 Stunden auf anstehende Erneuerungen prüfen; bei Fehlern in späteren Durchläufen erneut versuchen."

