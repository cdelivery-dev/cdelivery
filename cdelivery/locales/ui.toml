zh-CN = "启用 Socket Mode，填写 Bot Token（xoxb-）和 App Token（xapp-）。显示姓名和头像须授予 users:read。"
zh-TW = "啟用 Socket Mode，填寫 Bot Token（xoxb-）和 App Token（xapp-）。顯示姓名與頭像須授予 users:read。"
ja = "Socket Mode を有効にし、Bot トークン（xoxb-）とアプリトークン（xapp-）を設定してください。名前とアバターの表示には users:read 権限が必要です。"
pt-BR = "Ative Socket Mode. Use um token de bot (xoxb-) e um token de aplicação (xapp-). Para exibir nomes e avatares, conceda users:read."
es = "Activa Socket Mode. Usa un token de bot (xoxb-) y un token de aplicación (xapp-). Para mostrar nombres y avatares, se requiere users:read."
fr = "Activer Socket Mode. Utiliser un jeton de bot (xoxb-) et un jeton d’application (xapp-). L’affichage des noms et avatars nécessite users:read."
de = "Socket Mode aktivieren. Ein Bot-Token (xoxb-) und ein App-Token (xapp-) verwenden. Für Namen und Avatare ist users:read erforderlich."

