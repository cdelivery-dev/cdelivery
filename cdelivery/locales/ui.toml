de = "Im deaktivierten Zustand führt der Bereitschaftsdienst keine KI-Analysen oder Prüfungen durch und sendet keine eigenen Benachrichtigungen. Gewöhnliche Alarme werden weiterhin gesendet. Ausstehende und während der Deaktivierung auftretende Ereignisse werden nach der erneuten Aktivierung nicht nachträglich analysiert."

