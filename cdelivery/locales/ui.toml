de = "Update-Absicherung aktivieren"

[ui.xhealth.guardian.description]
en = "Each update first deploys a hidden test container and health-checks it. If the check does not pass in time, the update is blocked; verify the health check configuration and test code."
zh-CN = "每次更新前会先部署一个用户无法访问的测试容器并执行健康检查；未在规定时间内通过时将阻止本次更新，此时应检查健康检查配置和测试代码。"
zh-TW = "每次更新前，會先部署使用者無法存取的測試容器並執行健康檢查；若未在指定時間內通過，便會阻止此次更新。此時請檢查健康檢查設定和測試程式碼。"
ja = "更新前に、ユーザーがアクセスできないテスト用コンテナでヘルスチェックを実行します。制限時間内に合格しなければ更新を停止します。ヘルスチェックの設定とテストコードを確認してください。"
pt-BR = "Cada atualização cria primeiro um contêiner de teste sem acesso pelos usuários e verifica sua saúde. Se a verificação não passar no prazo, a atualização será bloqueada. Nesse caso, verifique a configuração e o código do teste."
es = "Antes de cada actualización se despliega un contenedor de prueba sin acceso para los usuarios y se comprueba su estado. Si no supera la comprobación a tiempo, la actualización se bloquea; revisa la configuración y el código de prueba."
fr = "Chaque mise à jour commence par le déploiement d’un conteneur de test inaccessible aux utilisateurs, puis une vérification de son état de santé. Si elle ne réussit pas dans le délai prévu, la mise à jour est bloquée. Vérifier alors la configuration et le code du test."
de = "Vor jedem Update wird ein für Nutzer nicht erreichbarer Testcontainer bereitgestellt und geprüft. Besteht er die Zustandsprüfung nicht rechtzeitig, wird das Update blockiert. Dann die Konfiguration der Zustandsprüfung und den Testcode prüfen."

