[ui.settings.agent.duty.enabled.help]
en = "When disabled, Duty stops AI analysis, patrols, and Duty notifications. Ordinary alerts continue. Pending events and events raised while disabled are not analyzed when Duty is enabled again."
zh-CN = "停用后不进行 AI 分析、巡查或值班通知，普通告警继续发送。待处理和停用期间的事件不会在重新启用后补做 AI 分析。"
