[ui.settings.channels.telegram.help]
en = "Use a dedicated BotFather token. CDelivery long-polls and removes existing webhooks. With Privacy Mode on, it accepts direct messages, /cdelivery@BotUsername commands, and group replies to the bot. Topics are unsupported."
zh-CN = "使用专用 BotFather Token。CDelivery 通过长轮询收信并移除已有 Webhook。Privacy Mode 开启时支持私信、/cdelivery@BotUsername 命令和群内对 Bot 的回复，不支持话题。"
zh-TW = "使用專用的 BotFather Token。CDelivery 以長輪詢接收訊息，並移除現有 Webhook。開啟 Privacy Mode 時，支援私訊、/cdelivery@BotUsername 指令及群組內對 Bot 的回覆，不支援話題。"
ja = "BotFather で発行した専用トークンを使用します。CDelivery はロングポーリングで受信し、既存の Webhook を削除します。Privacy Mode が有効な場合、ダイレクトメッセージ、/cdelivery@BotUsername コマンド、グループ内の Bot への返信に対応します。トピックには対応していません。"
pt-BR = "Use um token exclusivo do BotFather. O CDelivery recebe mensagens por long polling e remove os webhooks existentes. Com Privacy Mode ativado, aceita mensagens privadas, comandos /cdelivery@BotUsername e respostas ao bot em grupos. Tópicos não são compatíveis."
es = "Usa un token de BotFather exclusivo para CDelivery. CDelivery recibe mensajes mediante long polling y elimina los webhooks existentes. Con Privacy Mode activado, admite mensajes privados, comandos /cdelivery@BotUsername y respuestas al bot en grupos. No admite temas."
fr = "Utiliser un jeton BotFather dédié. CDelivery reçoit les messages par long polling et supprime les webhooks existants. Avec Privacy Mode activé, les messages privés, les commandes /cdelivery@BotUsername et les réponses au bot dans les groupes sont acceptés. Les sujets ne sont pas pris en charge."
de = "Ein eigenes BotFather-Token verwenden. CDelivery nutzt Long Polling und entfernt vorhandene Webhooks. Bei aktiviertem Privacy Mode werden Direktnachrichten, /cdelivery@BotUsername-Befehle und Antworten an den Bot in Gruppen angenommen. Themen werden nicht unterstützt."

[ui.settings.channels.discord.help]
en = "Grant View Channels, Send Messages, and Send Messages in Threads. Accepts direct messages and explicit bot mentions. No privileged Message Content intent or public endpoint needed."
zh-CN = "授予 View Channels、Send Messages 和 Send Messages in Threads。支持私信和明确提及 Bot 的消息，无需特权 Message Content Intent 或公网端点。"
zh-TW = "授予 View Channels、Send Messages 和 Send Messages in Threads。支援私訊及明確提及 Bot 的訊息，無須特權 Message Content Intent 或公開網路端點。"
ja = "View Channels、Send Messages、Send Messages in Threads を許可してください。ダイレクトメッセージと Bot への明示的なメンションに対応します。特権の Message Content Intent や公開エンドポイントは不要です。"
pt-BR = "Conceda View Channels, Send Messages e Send Messages in Threads. Aceita mensagens privadas e menções explícitas ao bot. Não exige a intent privilegiada Message Content nem um endpoint público."
es = "Concede View Channels, Send Messages y Send Messages in Threads. Admite mensajes privados y menciones explícitas al bot. No requiere el intent privilegiado Message Content ni un endpoint público."
fr = "Accorder les permissions View Channels, Send Messages et Send Messages in Threads. Les messages privés et les mentions explicites du bot sont acceptés. Aucun intent privilégié Message Content ni aucune URL publique ne sont nécessaires."
de = "Die Rechte View Channels, Send Messages und Send Messages in Threads erteilen. Direktnachrichten und ausdrückliche Bot-Erwähnungen werden angenommen. Weder der privilegierte Message Content Intent noch ein öffentlicher Endpunkt ist erforderlich."

