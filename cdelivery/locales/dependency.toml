[dependency.immutable]
en = "Configuration is fixed after creation. DSNs and credentials are not shown; create a new dependency to replace them."
zh-CN = "创建后配置不可修改；DSN 与凭证不回显，替换时请新建依赖。"
zh-TW = "建立後設定不可修改；DSN 與憑證不會顯示，替換時請建立新依賴。"
ja = "作成後に設定は変更できません。DSN と認証情報は表示されません。置き換える場合は新しい依存先を作成してください。"
pt-BR = "A configuração é fixa após a criação. DSNs e credenciais não são exibidos; crie uma nova dependência para substituí-los."
es = "La configuración no se puede cambiar tras crearla. Los DSN y las credenciales no se muestran; crea otra dependencia para reemplazarlos."
fr = "La configuration est définitive après création. Le DSN et les identifiants ne sont pas affichés ; créez une dépendance pour les remplacer."
de = "Die Konfiguration ist nach dem Erstellen unveränderlich. DSNs und Zugangsdaten werden nicht angezeigt; erstellen Sie zum Ersetzen eine neue Abhängigkeit."

