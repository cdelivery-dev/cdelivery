[change.closeConfirm]
en = "Cancel this change and clean up temporary resources? Production changes remain."
zh-CN = "取消变更并清理临时资源？已执行的生产变更会保留。"
zh-TW = "取消變更並清理暫存資源？已執行的正式變更會保留。"
ja = "変更をキャンセルし、一時リソースを削除しますか？本番に適用した変更は維持されます。"
pt-BR = "Cancelar esta alteração e limpar recursos temporários? Alterações em produção serão mantidas."
es = "¿Cancelar este cambio y limpiar los recursos temporales? Los cambios en producción se conservan."
fr = "Annuler ce changement et nettoyer les ressources temporaires ? Les changements en production sont conservés."
de = "Diese Änderung abbrechen und temporäre Ressourcen bereinigen? Produktionsänderungen bleiben bestehen."

[change.applyConfirm]
en = "Clean up rehearsal resources and apply this change to production without completing rehearsal?"
zh-CN = "清理演练资源后，跳过演练直接上线此变更？"
zh-TW = "清理演練資源後，略過演練直接上線此變更？"
ja = "検証リソースを削除し、検証を完了せずに本番へ適用しますか？"
pt-BR = "Limpar os recursos de ensaio e aplicar em produção sem concluir o ensaio?"
es = "¿Limpiar los recursos de ensayo y aplicar en producción sin completar el ensayo?"
fr = "Nettoyer les ressources de test et appliquer en production sans terminer le test ?"
de = "Testressourcen bereinigen und ohne abgeschlossenen Test in Produktion anwenden?"

[change.reapplyConfirm]
en = "Execute the production change again, including the original SQL? It may already have changed data; verify the previous result first."
zh-CN = "再次执行生产变更（含原始 SQL）？此前可能已修改数据，请先核实结果。"
zh-TW = "再次執行正式變更（含原始 SQL）？先前可能已修改資料，請先核實結果。"
ja = "元の SQL を含む本番変更を再実行しますか？すでにデータが変更されている可能性があるため、先に前回の結果を確認してください。"
pt-BR = "Executar a alteração em produção novamente, incluindo o SQL original? Ela pode já ter alterado dados; verifique primeiro o resultado anterior."
es = "¿Ejecutar de nuevo el cambio en producción, incluido el SQL original? Puede haber modificado datos; verifica primero el resultado anterior."
fr = "Réexécuter le changement en production, y compris le SQL d’origine ? Il a peut-être déjà modifié les données ; vérifiez d’abord le résultat précédent."
de = "Die Produktionsänderung einschließlich des ursprünglichen SQL erneut ausführen? Sie könnte bereits Daten geändert haben; prüfen Sie zuerst das vorherige Ergebnis."

[change.completeConfirm]
en = "Confirm the production result and complete this change? This only cleans up temporary resources; it does not execute the production change."
zh-CN = "确认生产结果并完成变更？仅清理临时资源，不执行生产变更。"
zh-TW = "確認正式環境結果並完成變更？僅清理暫存資源，不執行正式變更。"
ja = "本番の結果を確認し、変更を完了しますか？一時リソースのみ削除し、本番変更は実行しません。"
pt-BR = "Confirmar o resultado em produção e concluir esta alteração? Isso apenas limpa recursos temporários; não executa a alteração em produção."
es = "¿Confirmar el resultado en producción y completar este cambio? Solo limpia recursos temporales; no ejecuta el cambio en producción."
fr = "Confirmer le résultat en production et terminer ce changement ? Seules les ressources temporaires sont nettoyées ; le changement en production n’est pas exécuté."
de = "Produktionsergebnis bestätigen und diese Änderung abschließen? Dabei werden nur temporäre Ressourcen bereinigt; die Produktionsänderung wird nicht ausgeführt."

