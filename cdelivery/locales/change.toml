zh-TW = "本應用程式或其直接依賴更新時，先透過內部連接埠檢查本應用程式的預覽服務。Hurl 和網域檢查使用 HTTP。"
ja = "アプリ自身または直接の依存先を更新する前に、プレビューサービスの内部ポートで検証します。Hurl とドメイン指定のチェックは HTTP を使用します。"
pt-BR = "Antes de atualizar esta aplicação ou suas dependências diretas, verifica seu serviço de prévia pela porta interna. Hurl e verificações por domínio usam HTTP."
es = "Antes de actualizar esta aplicación o sus dependencias directas, comprueba su servicio de vista previa por el puerto interno. Hurl y las comprobaciones por dominio usan HTTP."
fr = "Avant de mettre à jour cette application ou ses dépendances directes, vérifier son service de prévisualisation sur le port interne. Hurl et les contrôles par domaine utilisent HTTP."
de = "Vor Updates dieser App oder ihrer direkten Abhängigkeiten den Vorschaudienst am internen Port prüfen. Hurl- und Domainprüfungen verwenden HTTP."

