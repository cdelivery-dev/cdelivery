[error.ReplicaBoundsInvalid]
en = "replica bounds must satisfy 1 <= min <= max <= 65536; max may be omitted"
zh-CN = "实例数范围必须满足 1 ≤ min ≤ max ≤ 65536；max 可以省略"
zh-TW = "執行個體數範圍必須符合 1 ≤ min ≤ max ≤ 65536；max 可以省略"
ja = "インスタンス数は 1 ≤ min ≤ max ≤ 65536 を満たす必要があります。max は省略できます。"
pt-BR = "os limites de réplicas devem respeitar 1 ≤ min ≤ max ≤ 65536; max pode ser omitido"
es = "los límites de réplicas deben cumplir 1 ≤ min ≤ max ≤ 65536; max se puede omitir"
fr = "les limites de réplicas doivent respecter 1 ≤ min ≤ max ≤ 65536 ; max peut être omis"
