pt-BR = "o volume ainda é referenciado por contêineres; remova esses contêineres antes de excluí-lo"
es = "hay contenedores que aún hacen referencia al volumen; elimina esos contenedores antes de borrarlo"
fr = "Le volume est encore référencé par des conteneurs ; supprimez ces conteneurs avant de supprimer le volume"
de = "Das Volume wird noch von Containern referenziert; entfernen Sie diese Container, bevor Sie das Volume löschen"
