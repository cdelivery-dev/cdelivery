{%- macro input(id, reference, reusable) -%}
<input
  x-ref="{{ reference }}"
  id="{{ id }}"
  class="text"
  type="password"
  maxlength="4096"
  autocomplete="new-password"
  :required="!{{ reusable }}"
  :disabled="submitting"
  :placeholder="{{ reusable }} ? $el.dataset.reuse : $el.dataset.required"
  data-reuse='{{ tt!("ui.settings.secret.reuse") }}'
  data-required='{{ tt!("ui.settings.secret.required") }}'
/>
{%- endmacro -%}
