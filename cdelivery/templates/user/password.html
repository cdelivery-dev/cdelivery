{%- macro fields(password_id, confirm_id, label, required) -%}
<div class="field">
  <label for="{{ password_id }}">{{ label }}: </label>
  <input x-ref="password" id="{{ password_id }}" class="text" type="password" autocomplete="new-password" minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" title='{{ tt!("ui.form.user.password.validation") }}' @input="$refs.confirmPassword.setCustomValidity($refs.confirmPassword.value && $refs.confirmPassword.value !== $el.value ? $refs.confirmPassword.dataset.mismatch : '')"{% if required %} required{% endif %} />
</div>
<div class="field">
  <label for="{{ confirm_id }}">{{ tt!("ui.form.user.confirmPassword.label") }}: </label>
  <input x-ref="confirmPassword" id="{{ confirm_id }}" class="text" type="password" autocomplete="new-password" minlength="8" data-mismatch='{{ tt!("ui.form.user.confirmPassword.validation") }}' @input="$el.setCustomValidity($el.value !== $refs.password.value ? $el.dataset.mismatch : '')"{% if required %} required{% endif %} />
</div>
{%- endmacro -%}
