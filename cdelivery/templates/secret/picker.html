{%- macro select(id) -%}
<div class="field" x-show="source === 'Secret'">
  <label for="{{ id }}">{{ tt!("secret.label") }}</label>
  <select id="{{ id }}" class="text" x-model="selectedSecret" :disabled="!isOpen || source !== 'Secret' || secretLoading" :required="isOpen && source === 'Secret'">
    <option value="">{{ tt!("secret.select") }}</option>
    <template x-for="secret in secretOptions" :key="secret.id"><option :value="secret.id" :selected="secret.id === selectedSecret" x-text="secret.name"></option></template>
  </select>
  <small class="block" x-text="secretDescription()"></small>
  <small class="block" x-show="!secretLoading && secretOptions.length === 0 && !secretError">{{ tt!("secret.emptyType") }}</small>
  <small class="block" role="alert" x-show="secretError" x-text="secretError"></small>
</div>
{%- endmacro -%}
