{% extends "protected.html" %}

{% block header_account %}
<a href="/account"><span class="wide">{{ account.user_name }}</span><span class="narrow">{{ account.initials }}</span></a>
{% endblock header_account %}

{% block navigation %}
<nav id="page-navigation" aria-label='{{ tt!("ui.account.navigation") }}'>
  <ul id="nav-index">
    {% block account_navigation %}{% endblock account_navigation %}
  </ul>
</nav>
{% endblock navigation %}
